name = "30x-hackathon"
account_id = "f23a90e15150a8af524f01d3bce393ab"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_ENV = "production"
SUPABASE_URL = "https://dhjumvswohajnusdifim.supabase.co"  # public
SUPABASE_ANON_KEY = "sb_publishable_qKF4nId7_l5TJ78gSEAgWQ_bfZiFx4K"     # public by design; RLS protects data
WORKERS_AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"  # product LLM; change here, not in code
WORKERS_AI_VISION_MODEL = "@cf/meta/llama-3.2-11b-vision-instruct"
BEDROCK_MODEL_ID = "amazon.nova-lite-v1:0"  # AC-89 primary reader; Workers AI above is the fallback
BEDROCK_REGION = "us-east-2"
SES_REGION = "us-east-2"
JEV_ENABLED = "false"
DEMO_EMAIL = "demo@andina-labs.example"
APP_URL = "https://30x-hackathon.30x-hackathon-roberto-zuniga.workers.dev"  # approval links built outside a request (cron)
PORTAL_URL = "https://facturas.30x-hackathon-roberto-zuniga.workers.dev"  # the vendor portal Worker (portal/wrangler.toml, AC-83, AC-86)
INBOUND_EMAIL_DOMAIN = ""  # email intake (AC-87): facturas+<slug>@<this domain>; set it after Email Routing sends the catch-all here (AC-88)
FX_PROVIDER = "yahoo"  # first market-rate provider: "yahoo" or "er-api"; the other is the fallback (AC-73)

# D40, AC-99: run the Worker near its back end (Supabase), so each screen's one RPC is a short round trip.
[placement]
mode = "smart"

[triggers]
crons = ["*/5 * * * *", "0 11 * * *"]  # the agent decides pending invoices with nobody logged in (D23, AC-62); daily FX at 06:00 Bogotá (AC-73)

[ai]
binding = "AI"  # Workers AI: no key, authorised by the account

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Secrets (wrangler secret put): AWS_BEDROCK_ACCESS_KEY_ID, AWS_BEDROCK_SECRET_ACCESS_KEY, AWS_SES_ACCESS_KEY_ID, AWS_SES_SECRET_ACCESS_KEY, SES_FROM_EMAIL, SUPABASE_SERVICE_ROLE_KEY, APPROVAL_HMAC_SECRET. Legacy: RESEND_API_KEY, SUPABASE_POOLER_URL. Optional: TYPESAFE_API_KEY, ANTHROPIC_API_KEY
